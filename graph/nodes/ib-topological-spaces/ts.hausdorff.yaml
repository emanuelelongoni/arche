knowledge_points:
- State the Hausdorff (T₂) axiom; show metric spaces are Hausdorff
- Prove limits of sequences in a Hausdorff space are unique
- 'Recognise non-Hausdorff spaces: the cofinite topology on an infinite set, Sierpiński space'
