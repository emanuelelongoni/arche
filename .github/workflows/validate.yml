name: validate

on:
  pull_request:
  push:
    branches: [main]

jobs:
  graph:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pyyaml jsonschema pytest
      - name: Validate graph
        run: python3 tools/validate.py --report-md report.md
      - name: Anchor file is up to date
        run: python3 tools/gen_anchor_check.py --check
      - name: Validator and planner tests
        run: python3 -m pytest -q tests
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: graph-report
          path: report.md

  anchors:
    runs-on: ubuntu-latest
    needs: graph
    defaults:
      run:
        working-directory: lean
    steps:
      - uses: actions/checkout@v4
      - name: Install elan
        run: |
          curl -sSfL https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> "$GITHUB_PATH"
      - uses: actions/cache@v4
        with:
          path: lean/.lake
          key: lake-${{ hashFiles('lean/lakefile.toml', 'lean/lean-toolchain') }}
      - name: Resolve dependencies (writes lake-manifest.json if missing; commit it after the first run)
        run: test -f lake-manifest.json || lake update
      - name: Fetch Mathlib build cache
        run: lake exe cache get
      - name: Every anchor exists in pinned Mathlib
        run: lake build
