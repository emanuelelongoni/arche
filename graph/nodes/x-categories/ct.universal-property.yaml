id: ct.universal-property
title: Universal properties
course: x-categories
section: 2
kind: concept
status: draft
minutes: 40
verification: formal
only_in:
- npov
knowledge_points:
- Define terminal and initial objects and prove they are unique up to unique isomorphism
- Define products and coproducts by universal properties; compute them in Set and Top
- Recognise the universal property of a quotient set X → X/~
- Read a universal property as a natural bijection of hom-sets, e.g. Hom(Z, X × Y) ≅ Hom(Z, X) × Hom(Z,
  Y)
requires:
- node: ct.functors
  reason: Hom-set bijections and their naturality are stated with functors.
- node: ns.equivalence-relations
  reason: The quotient-set example uses equivalence relations.
anchors:
- decl: CategoryTheory.Limits.IsTerminal
- decl: CategoryTheory.Limits.IsLimit
msc:
- 18A30
