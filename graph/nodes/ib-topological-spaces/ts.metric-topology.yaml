- node: a2.metric-open-closed
  weight: 0.3
illuminates:
- node: a2.norm-equivalence
  note: Lipschitz-equivalent norms induce the same topology, so 'the' topology of ℝⁿ makes sense.
anchors:
- decl: Metric.isOpen_iff
- decl: TopologicalSpace.IsTopologicalBasis
covers:
- ib-topological-spaces#topologies-from-metrics
